<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="question-page">
            <img src="mike-hey.jpeg" alt="Cute Bear" class="gif">
            <h1>Hey Aaryaa, Cutiepie🌹</h1>
            <h2>Do you love me ?..</h2>
            <div class="buttons">
                <button id="yes-btn" onclick="showSurprise()">YES!</button>
                <button id="no-btn" onmouseover="moveButton()">No</button>
            </div>
        </div>

        <div id="surprise-page" class="hidden">
            <h1>Yay! I love you! ❤️</h1>
            <p>Here are some of our best memories:</p>
            <div class="photo-gallery">
                <img src="4.jpeg" alt="Memory 1">
                <img src="3.jpeg" alt="Memory 2">
                <img src="1.jpeg" alt="Memory 3">
            </div>
            <p class="love-note">"To the peace of my life, you make every day brighter... 💗"</p>
        </div>
    </div>
    <div id="screen2" class="screen">
    <h2 style="color: #5e3023;">Yay, you said yes!</h2>
    <p>I made these special surprises for you:</p>
    
    <div class="gift-grid">
        <div class="gift-box" onclick="nextScreen(3)">
            <span class="gift-icon">🌹</span>
            <span class="gift-label">Surprise 1</span>
        </div>
        
        <div class="gift-box" onclick="nextScreen(4)">
            <span class="gift-icon">💌</span>
            <span class="gift-label">Surprise 2</span>
        </div>
        
        <div class="gift-box" onclick="nextScreen(5)">
            <span class="gift-icon">🎵</span>
            <span class="gift-label">Surprise 3</span>
        </div>
    </div>
</div>
         <script src="script.js"></script>
</body>
</html>
