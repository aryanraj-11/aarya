<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="question-page">
            <img src="mike.jpg.jpeg" alt="Cute Bear" class="gif">
            <h1>Hey Aaryaa, Cutiepie🌹</h1>
            <h1>DO YOU LOVE ME ?..</h1>
            <div class="buttons">
                <button id="yes-btn" onclick="showSurprise()">YES!</button>
                <button id="no-btn" onmouseover="moveButton()">No</button>
            </div>
        </div>

        <div id="surprise-page" class="hidden">
            <h1>Yay! I love you! ❤️</h1>
            <p>Here are some of our best memories:</p>
            <div class="photo-gallery">
                <img src="us3.jpg.jpeg" alt="Memory 1">
                <img src="5.jpeg" alt="Memory 2">
                <img src="us4.jpg.jpeg" alt="Memory 3">
            </div>
            <p class="love-note">"To the peace of my life, you make every day brighter... 💗"</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
